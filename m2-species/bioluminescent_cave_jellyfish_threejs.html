<html lang="zh-TW">

<title>深邃幽藍生物螢光水母群 · 暴衝</title>

<!-- Fonts: Cinzel for Souls-like Demon's Souls typography, Fira Code for technical accents -->

<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #010206;
  color: #c9d1d9;
  font-family: 'Cinzel', Georgia, -apple-system, sans-serif;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
canvas { display: block; }

/* Subtle abyssal cave vignette */
#vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(1, 2, 6, 0.80) 100%);
}

#loading {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #010206;
  display: grid;
  place-items: center;
  transition: opacity 0.8s ease, visibility 0.8s ease;
}
#loading.hide { opacity: 0; visibility: hidden; }
.loader-ring {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 2px solid rgba(56, 189, 248, 0.12);
  border-top-color: #38bdf8;
  box-shadow: 0 0 24px rgba(56, 189, 248, 0.35);
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Flash effect for overdrive burst */
#flash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 15;
  opacity: 0;
  background: radial-gradient(circle at 50% 55%, rgba(96, 235, 255, 0.28), rgba(20, 90, 140, 0.12) 50%, transparent 80%);
}
#flash.fire { animation: flash-burst 0.9s cubic-bezier(0.1, 0.9, 0.2, 1); }
@keyframes flash-burst {
  0% { opacity: 0; transform: scale(0.96); }
  15% { opacity: 1; transform: scale(1.02); }
  100% { opacity: 0; transform: scale(1.0); }
}

 * Demon's Souls Style UI Button (Reference: f385403bdcdefd073a1aadb78dd4977a.jpg)
 * Ethereal horizontal mist bar, razor-fine hairline accents, classical cinematic serif
 * ------------------------------------------------------------- */
.ui-layer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 46px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
}

.souls-btn {
  pointer-events: auto;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 360px;
  padding: 16px 48px;
  background: transparent;
  border: none;
  outline: none;
  cursor: pointer;
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
}

.souls-btn .btn-mist {
  position: absolute;
  inset: 0;
  border-radius: 4px;
  background: radial-gradient(ellipse 90% 75% at 50% 50%,
    rgba(56, 189, 248, 0.38) 0%,
    rgba(24, 120, 150, 0.24) 40%,
    rgba(8, 48, 65, 0.10) 70%,
    transparent 100%);
  filter: blur(6px);
  opacity: 0.85;
  transition: opacity 0.4s ease, transform 0.4s ease, background 0.4s ease;
  z-index: 1;
}

/* Hairline accent lines on top and bottom */
.souls-btn .btn-line {
  position: absolute;
  left: 6%;
  right: 6%;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(96, 235, 255, 0.15) 15%,
    rgba(180, 250, 255, 0.75) 50%,
    rgba(96, 235, 255, 0.15) 85%,
    transparent 100%);
  opacity: 0.7;
  transition: opacity 0.4s ease, transform 0.4s ease, left 0.4s ease, right 0.4s ease;
  z-index: 2;
}
.souls-btn .btn-line.top { top: 0; }
.souls-btn .btn-line.bottom { bottom: 0; }

.souls-btn .btn-pip {
  position: absolute;
  width: 5px;
  height: 5px;
  background: #cffafe;
  box-shadow: 0 0 8px rgba(125, 245, 255, 0.9);
  transform: translate(-50%, -50%) rotate(45deg);

  z-index: 3;
  opacity: 0.8;
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.souls-btn .btn-pip.top { top: 0; }
.souls-btn .btn-pip.bottom { bottom: 0; }

/* Classical cinematic serif text */
.souls-btn .btn-text {
  position: relative;
  z-index: 4;

  transition: color 0.35s ease;

  margin-top: 9px;
  font-family: 'Fira Code', monospace;

  color: rgba(140, 190, 220, 0.42);

  transition: color 0.35s ease;

/* Hover effects */
.souls-btn:hover {
  transform: translateY(-2px) scale(1.02);
  filter: drop-shadow(0 0 22px rgba(56, 189, 248, 0.45));
}
.souls-btn:hover .btn-mist {
  opacity: 1;
  background: radial-gradient(ellipse 95% 85% at 50% 50%,
    rgba(96, 235, 255, 0.55) 0%,
    rgba(34, 160, 200, 0.38) 45%,

}

.souls-btn:active {

}
.souls-btn.is-active .btn-mist {

}
.souls-btn.is-firing {

  25% { transform: scale(0.95); }
  55% { transform: scale(1.04); }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const TAU = Math.PI * 2;

// Spatial bounding volume for autonomous swimming
const BOUNDS_XZ = 380;
const BOUNDS_Y = 210;
const MIN_SEPARATION = 165;

const clock = new THREE.Clock();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010206);
scene.fog = new THREE.FogExp2(0x010206, 0.00035);

const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 5000);
camera.position.set(0, 30, 580);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0.64,
  0.30,
  0.78
);
composer.addPass(bloomPass);

const GradeShader = {
  uniforms: { tDiffuse: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ vec4 col=texture2D(tDiffuse,vUv); vec2 p=vUv-0.5; col.rgb*=(1.0-dot(p,p)*0.45); gl_FragColor=col; }`
};
composer.addPass(new ShaderPass(GradeShader));
composer.addPass(new OutputPass());

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = true;
controls.minDistance = 220;
controls.maxDistance = 1600;
controls.target.set(0, 10, 0);

const hemiLight = new THREE.HemisphereLight(0x0a223a, 0x01050e, 0.65);
scene.add(hemiLight);

// -------------------------------------------------------------
// Shared drifting motes (underwater marine snow)
// -------------------------------------------------------------
const snowCount = 260, sArr = [];
for (let i = 0; i < snowCount; i++) {
  sArr.push(
    THREE.MathUtils.randFloat(-800, 800),
    THREE.MathUtils.randFloat(-500, 500),
    THREE.MathUtils.randFloat(-700, 700)
  );
}
const snowGeo = new THREE.BufferGeometry();
snowGeo.setAttribute('position', new THREE.Float32BufferAttribute(sArr, 3));
const snowMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uSpeedMultiplier: { value: 1.0 }, uColor: { value: new THREE.Color(0x9fe8ff) } },
  vertexShader: `
    uniform float uTime;
    uniform float uSpeedMultiplier;
    void main() {
      vec3 p = position;
      p.y += sin(uTime * 0.35 * uSpeedMultiplier + position.x * 0.005) * 10.0;
      p.z += cos(uTime * 0.25 * uSpeedMultiplier + position.y * 0.004) * 8.0;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = max(1.2, 2.4 * (240.0 / -mv.z));
    }
  `,
  fragmentShader: `
    uniform vec3 uColor;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      if (length(c) > 0.5) discard;
      float a = smoothstep(0.5, 0.05, length(c)) * 0.35;
      gl_FragColor = vec4(uColor * 1.6, a);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});
scene.add(new THREE.Points(snowGeo, snowMat));

// -------------------------------------------------------------
// Creature Palettes: Cyan (青色) / Pink (粉色) / Blue (藍色)
// Distinct jewel-toned, bioluminescent identities
// -------------------------------------------------------------
const speciesPalettes = [
  {
    name: 'CYAN',
    label: '天青',
    primaryGlow: 0x06b6d4,        // Pure turquoise
    secondaryGlow: 0x10b981,      // Emerald seafoam
    membraneBase: 0x02161a,       // Abyssal petrol green
    membraneRim: 0x22d3ee,        // Radiant cyan rim
    membraneCore: 0xcffafe,       // Ethereal crystal cyan
    coreLineColor: 0x67e8f9,      // Glowing cyan lines
    coreLineEmissive: 0x0891b2,   // Deep teal emission
    tentacleColor: 0xa5f3fc,      // Aqua tentacles
    tentacleEmissive: 0x0e7490,   // Glowing aqua tentacles
    beadEmissive: 0x22d3ee,       // Turquoise pearls
    beadLight: 0x06b6d4           // Cyan point lights
  },
  {
    name: 'PINK',
    label: '幽粉',
    primaryGlow: 0xe11d48,        // Deep rose
    secondaryGlow: 0xf43f5e,      // Vibrant magenta
    membraneBase: 0x160410,       // Abyssal wine
    membraneRim: 0xf43f5e,        // Radiant pink-magenta
    membraneCore: 0xfce7f3,       // Soft pale rose glow
    coreLineColor: 0xfda4af,      // Bright pink lines
    coreLineEmissive: 0xdb2777,   // Deep fuchsia emission
    tentacleColor: 0xfbcfe8,      // Rose tentacles
    tentacleEmissive: 0xbe185d,   // Glowing rose tentacles
    beadEmissive: 0xf43f5e,       // Vivid magenta pearls
    beadLight: 0xe11d48           // Warm rose point lights
  },
  {
    name: 'BLUE',
    label: '星藍',
    primaryGlow: 0x1d4ed8,        // Deep royal cobalt
    secondaryGlow: 0x38bdf8,      // Electric cyan-blue
    membraneBase: 0x030718,       // Abyssal midnight navy
    membraneRim: 0x3b82f6,        // Vibrant azure sapphire
    membraneCore: 0xbfdbfe,       // Ethereal ice-azure
    coreLineColor: 0x93c5fd,      // Glowing sapphire lines
    coreLineEmissive: 0x2563eb,   // Brilliant cobalt emission
    tentacleColor: 0xbfdbfe,      // Azure tentacles
    tentacleEmissive: 0x1d4ed8,   // Deep blue tentacle glow
    beadEmissive: 0x38bdf8,       // Electric azure pearls
    beadLight: 0x2563eb           // Royal blue point lights
  }
];

// -------------------------------------------------------------
// Shared geometry builders
// -------------------------------------------------------------
function createCtenophoreCapsuleGeometry() {
  const segsY = 48, segsTheta = 60;
  const positions = [], uvs = [], indices = [];
  const halfH = 36.0;
  const rMid = 25.5;
  const rPole = 5.2;

  for (let i = 0; i <= segsY; i++) {
    const v = i / segsY;
    const y = -halfH + v * (halfH * 2.0);
    const eta = y / halfH;
    const barrel = Math.pow(Math.max(0.0, 1.0 - eta * eta), 0.42);
    const baseR = rPole + (rMid - rPole) * barrel;

    for (let j = 0; j <= segsTheta; j++) {
      const u = j / segsTheta;
      const angle = u * TAU;
      const flute = 1.0 + 0.05 * Math.cos(8.0 * angle);
      const r = baseR * flute;
      positions.push(r * Math.cos(angle), y, r * Math.sin(angle));
      uvs.push(u, v);
    }
  }

  for (let i = 0; i < segsY; i++) {
    for (let j = 0; j < segsTheta; j++) {
      const a = i * (segsTheta + 1) + j;
      const b = (i + 1) * (segsTheta + 1) + j;
      const c = (i + 1) * (segsTheta + 1) + (j + 1);
      const d = i * (segsTheta + 1) + (j + 1);
      indices.push(a, b, d);
      indices.push(b, c, d);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

function createWavyBellGeometry(isTop) {
  const RADIAL_SEGS = 48;
  const RING_SEGS = 24;
  const positions = [], uvs = [], indices = [];
  const sign = isTop ? 1 : -1;
  const yBase = sign * 52;
  const bellHeight = 58;
  const rIn = 5.2;
  const rOut = 78.0;

  for (let r = 0; r <= RING_SEGS; r++) {
    const u = r / RING_SEGS;
    const baseRadius = rIn + (rOut - rIn) * Math.pow(u, 1.25);
    const yOffset = bellHeight * Math.pow(u, 1.34);

    for (let i = 0; i <= RADIAL_SEGS; i++) {
      const v = i / RADIAL_SEGS;
      const angle = v * TAU;
      const waveFactor = Math.pow(u, 2.4);
      const waveR = 5.4 * Math.sin(angle * 16) + 1.8 * Math.sin(angle * 32);
      const waveY = 3.8 * Math.cos(angle * 16);

      const currentR = Math.max(1.0, baseRadius + waveFactor * waveR);
      const currentY = yBase + sign * (yOffset + waveFactor * waveY);

      positions.push(currentR * Math.cos(angle), currentY, currentR * Math.sin(angle));
      uvs.push(u, v);
    }
  }

  for (let r = 0; r < RING_SEGS; r++) {
    for (let i = 0; i < RADIAL_SEGS; i++) {
      const a = r * (RADIAL_SEGS + 1) + i;
      const b = (r + 1) * (RADIAL_SEGS + 1) + i;
      const c = (r + 1) * (RADIAL_SEGS + 1) + (i + 1);
      const d = r * (RADIAL_SEGS + 1) + (i + 1);
      if (isTop) {
        indices.push(a, b, d);
        indices.push(b, c, d);
      } else {
        indices.push(a, d, b);
        indices.push(b, d, c);
      }
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  geo.userData.basePositions = new Float32Array(positions);
  return geo;
}

const specColors = [
  new THREE.Color(0x7c3aed),
  new THREE.Color(0x9333ea),
  new THREE.Color(0x00f0ff),
  new THREE.Color(0x38bdf8),
  new THREE.Color(0x10b981),
  new THREE.Color(0xf59e0b),
  new THREE.Color(0xec4899)
];
function writeSpectrumColor(target, val) {
  const p = ((val % 1) + 1) % 1;
  const scaled = p * specColors.length;
  const idx0 = Math.floor(scaled) % specColors.length;
  const idx1 = (idx0 + 1) % specColors.length;
  const f = scaled - Math.floor(scaled);
  target.copy(specColors[idx0]).lerp(specColors[idx1], f);
  return target;
}

// -------------------------------------------------------------
// Ctenophore Diffraction Iridescence Shader
// -------------------------------------------------------------
const ctenophoreShader = {
  uniforms: {
    uTime: { value: 0 },
    uColorBase: { value: new THREE.Color(0x000000) },
    uColorRim: { value: new THREE.Color(0x000000) },
    uPulseSpeed: { value: 1.0 },
    uDiffractionIntensity: { value: 1.0 }
  },
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vViewPosition;
    varying vec3 vWorldPosition;
    varying vec2 vUv;
    varying float vY;

    void main() {
      vUv = uv;
      vNormal = normalize(normalMatrix * normal);
      vec4 worldPos = modelMatrix * vec4(position, 1.0);
      vWorldPosition = worldPos.xyz;
      vY = position.y;
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      vViewPosition = -mvPosition.xyz;
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uColorBase;
    uniform vec3 uColorRim;
    uniform float uPulseSpeed;
    uniform float uDiffractionIntensity;

    varying vec3 vNormal;
    varying vec3 vViewPosition;
    varying vec3 vWorldPosition;
    varying vec2 vUv;
    varying float vY;

    vec3 spectralRainbow(float t) {
      t = fract(t);
      vec3 c;
      if (t < 0.32) {
        c = mix(vec3(0.62, 0.08, 1.0), vec3(0.85, 0.22, 1.0), t / 0.32);
      } else if (t < 0.62) {
        c = mix(vec3(0.85, 0.22, 1.0), vec3(0.0, 0.98, 1.0), (t - 0.32) / 0.30);
      } else if (t < 0.80) {
        c = mix(vec3(0.0, 0.98, 1.0), vec3(1.0, 0.82, 0.15), (t - 0.62) / 0.18);
      } else {
        c = mix(vec3(1.0, 0.82, 0.15), vec3(0.98, 0.10, 0.68), (t - 0.80) / 0.20);
      }
      return c;
    }

    void main() {
      vec3 N = normalize(vNormal);
      vec3 V = normalize(vViewPosition);
      float NdotV = abs(dot(N, V));

      float fresnel = pow(clamp(1.0 - NdotV, 0.0, 1.0), 2.0);
      vec3 baseGel = mix(vec3(0.003, 0.008, 0.02), vec3(0.01, 0.04, 0.10), fresnel);

      float rimPhase = fract(vY * 0.018 + uTime * 0.15 + fresnel * 0.4);
      vec3 rimRainbow = spectralRainbow(rimPhase);
      vec3 rimGlow = mix(vec3(0.2, 0.6, 1.0), rimRainbow, 0.6) * pow(fresnel, 2.0) * 2.2;

      float uLong = vUv.x;
      float combFrac = fract(uLong * 8.0);
      float distToRib = min(combFrac, 1.0 - combFrac);
      float ribCore = smoothstep(0.10, 0.015, distToRib);
      float ribHalo = smoothstep(0.26, 0.04, distToRib);

      float ciliaWave = sin(vY * 4.2 - uTime * 7.5 * uPulseSpeed);
      float ciliaSteps = pow(clamp(ciliaWave * 0.5 + 0.5, 0.0, 1.0), 2.2);

      float specPhase = fract((vY / 72.0) * 1.5 - uTime * 0.85 * uPulseSpeed + NdotV * 0.35);
      vec3 combColor = spectralRainbow(specPhase);

      vec3 combLight = combColor * (3.8 + 5.5 * ciliaSteps) * ribCore * uDiffractionIntensity;
      vec3 combGlow = combColor * ribHalo * 1.8 * (0.8 + 0.4 * ciliaWave);

      float coreDist = length(vec2(vWorldPosition.x, vWorldPosition.z));
      float corePenetration = exp(-coreDist * 0.10) * (1.0 - fresnel * 0.5);
      vec3 visceralGlow = vec3(0.88, 0.94, 1.0) * corePenetration * 0.28;

      vec3 finalColor = baseGel + rimGlow + combLight + combGlow + visceralGlow;
      float alpha = 0.14 + fresnel * 0.55 + ribCore * 0.82 + ribHalo * 0.25;
      alpha = clamp(alpha, 0.0, 0.96);

      gl_FragColor = vec4(finalColor, alpha);
    }
  `
};

// -------------------------------------------------------------
// Bell Membrane Fresnel Gradient Shader
// -------------------------------------------------------------
const bellGradientShader = {
  uniforms: {
    uTime: { value: 0 },
    uColorBase: { value: new THREE.Color(0x000000) },
    uColorRim: { value: new THREE.Color(0x000000) },
    uColorCore: { value: new THREE.Color(0x000000) },
    uFresnelPower: { value: 2.0 },
    uWaveAmp: { value: 1.0 }
  },
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vViewPosition;
    varying vec2 vUv;
    void main() {
      vUv = uv;
      vNormal = normalize(normalMatrix * normal);
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      vViewPosition = -mvPosition.xyz;
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uColorBase;
    uniform vec3 uColorRim;
    uniform vec3 uColorCore;
    uniform float uFresnelPower;
    uniform float uWaveAmp;
    varying vec3 vNormal;
    varying vec3 vViewPosition;
    varying vec2 vUv;

    void main() {
      vec3 N = normalize(vNormal);
      vec3 V = normalize(vViewPosition);
      float NdotV = abs(dot(N, V));
      float fresnel = pow(clamp(1.0 - NdotV, 0.0, 1.0), uFresnelPower);

      float u = vUv.x;
      float rimRuffle = sin(vUv.y * 3.14159265 * 16.0 - uTime * 3.0) * 0.06 * uWaveAmp;
      float radialGrad = smoothstep(0.06, 0.94, u + rimRuffle);

      vec3 col = mix(uColorBase, uColorRim, radialGrad * 0.82);
      col = mix(col, uColorCore, fresnel * 0.35);
      col += uColorRim * pow(radialGrad, 2.5) * 0.65;
      col += uColorCore * pow(fresnel, 3.8) * 0.55;

      float alpha = 0.08 + 0.32 * fresnel + 0.45 * radialGrad;
      alpha = clamp(alpha, 0.0, 0.82);

      gl_FragColor = vec4(col, alpha);
    }
  `
};

// -------------------------------------------------------------
// GPU-animated glow tube material
// -------------------------------------------------------------
function makeGlowTubeMaterial(color, intensity, amp, speed, phase, growth, opacity) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(color) },
      uIntensity: { value: intensity },
      uTime: { value: 0 },
      uAmp: { value: amp },
      uSpeed: { value: speed },
      uPhase: { value: phase },
      uGrowth: { value: growth },
      uScaleY: { value: 1.0 },
      uOpacity: { value: opacity }
    },
    vertexShader: `
      uniform float uTime;
      uniform float uAmp;
      uniform float uSpeed;
      uniform float uPhase;
      uniform float uGrowth;
      uniform float uScaleY;
      varying vec3 vNormal;
      void main() {
        vec3 p = position;
        float s = clamp(uv.x, 0.0, 1.0);
        float grow = pow(s, uGrowth);
        float w1 = sin(uTime * uSpeed + s * 9.42478 + uPhase);
        float w2 = cos(uTime * uSpeed * 0.73 + s * 6.28318 + uPhase * 1.7);
        float w3 = sin(uTime * uSpeed * 0.51 + s * 3.14159 + uPhase * 0.6);
        p.x += w1 * uAmp * grow;
        p.z += w2 * uAmp * 0.78 * grow;
        p.y += w3 * uAmp * 0.30 * grow;
        p.y *= uScaleY;
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 uColor;
      uniform float uIntensity;
      uniform float uOpacity;
      varying vec3 vNormal;
      void main() {
        float shade = 0.72 + 0.28 * abs(dot(normalize(vNormal), vec3(0.0, 0.0, 1.0)));
        gl_FragColor = vec4(uColor * uIntensity * shade, uOpacity);
      }
    `,
    transparent: opacity < 0.999,
    depthWrite: opacity >= 0.999
  });
}

// -------------------------------------------------------------
// Jellyfish Creature Class / Factory
// -------------------------------------------------------------
const jellyfishList = [];

function createJellyfish(P, spawnPos, initialHeading) {
  const root = new THREE.Group();
  root.scale.setScalar(0.42);
  root.position.copy(spawnPos);
  scene.add(root);

  const spineGlowMat = makeGlowTubeMaterial(P.coreLineColor, 2.5, 3.2, 2.2, 0, 0.0, 1.0);
  const spineSheathMat = makeGlowTubeMaterial(P.membraneRim, 0.75, 3.2, 2.2, 0, 0.0, 0.20);

  const staticGlowMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(P.coreLineColor).multiplyScalar(2.0)
  });

  // Central spine
  const stalkGroup = new THREE.Group();
  root.add(stalkGroup);

  const defaultSpineY = [-52, -42, -32, -21, -10, 0, 10, 21, 32, 42, 52];
  const spinePoints = defaultSpineY.map(y => new THREE.Vector3(0, y, 0));
  const spineCurve = new THREE.CatmullRomCurve3(spinePoints);

  const spineMesh = new THREE.Mesh(
    new THREE.TubeGeometry(spineCurve, 40, 2.0, 8, false),
    spineGlowMat
  );
  stalkGroup.add(spineMesh);

  const sheathMesh = new THREE.Mesh(
    new THREE.TubeGeometry(spineCurve, 32, 4.8, 10, false),
    spineSheathMat
  );
  stalkGroup.add(sheathMesh);

  const archStruts = [];
  for (let i = 0; i < 4; i++) {
    const angle = (i / 4) * TAU;
    const pts = [];
    const segments = 14;
    for (let j = 0; j <= segments; j++) {
      const v = j / segments;
      const y = -52 + v * 104;
      const bowRadius = 5.2 + 23.5 * Math.sin(v * Math.PI);
      pts.push(new THREE.Vector3(Math.cos(angle) * bowRadius, y, Math.sin(angle) * bowRadius));
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 20, 0.45, 6, false), staticGlowMat);
    stalkGroup.add(mesh);
    archStruts.push({ mesh, angle });
  }

  const spineNodes = new THREE.Group();
  stalkGroup.add(spineNodes);
  [-36, -18, 18, 36].forEach(y => {
    const torus = new THREE.Mesh(new THREE.TorusGeometry(6.2, 0.42, 8, 24), staticGlowMat);
    torus.rotation.x = Math.PI / 2;
    torus.position.y = y;
    spineNodes.add(torus);

    for (let a = 0; a < 4; a++) {
      const ang = a * (Math.PI / 2);
      const bead = new THREE.Mesh(
        new THREE.SphereGeometry(0.85, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      bead.position.set(Math.cos(ang) * 6.2, y, Math.sin(ang) * 6.2);
      spineNodes.add(bead);
    }
  });

  // Ctenophore core (Diffraction Bio-Chamber)
  const centerFlower = new THREE.Group();
  root.add(centerFlower);

  const nucleusCore = new THREE.Mesh(
    new THREE.SphereGeometry(4.5, 20, 16),
    new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: new THREE.Color(P.membraneCore),
      emissiveIntensity: 0.7,
      roughness: 0.35
    })
  );
  nucleusCore.scale.set(1.0, 1.45, 1.0);

  const nucleusShell = new THREE.Mesh(
    new THREE.SphereGeometry(8.2, 24, 18),
    new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(P.primaryGlow),
      emissive: new THREE.Color(P.secondaryGlow),
      emissiveIntensity: 0.75,
      roughness: 0.25,
      transmission: 0.90,
      thickness: 1.0,
      transparent: true,
      opacity: 0.85,
      clearcoat: 1.0
    })
  );
  nucleusShell.scale.set(1.0, 1.35, 1.0);
  centerFlower.add(nucleusCore, nucleusShell);

  const bioLightCenter = new THREE.PointLight(P.beadLight, 45, 380, 2.0);
  centerFlower.add(bioLightCenter);

  const ctenophoreMembraneMat = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.clone(ctenophoreShader.uniforms),
    vertexShader: ctenophoreShader.vertexShader,
    fragmentShader: ctenophoreShader.fragmentShader,
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false,
    blending: THREE.NormalBlending
  });
  ctenophoreMembraneMat.uniforms.uColorBase.value.set(P.membraneBase);
  ctenophoreMembraneMat.uniforms.uColorRim.value.set(P.membraneRim);

  const ctenophoreCapsuleMesh = new THREE.Mesh(createCtenophoreCapsuleGeometry(), ctenophoreMembraneMat);
  centerFlower.add(ctenophoreCapsuleMesh);

  const ctenoRibGroup = new THREE.Group();
  centerFlower.add(ctenoRibGroup);

  const ctenoRibs = [];
  const ctenoBeads = [];

  for (let r = 0; r < 8; r++) {
    const angle = (r / 8) * TAU;
    const pts = [];
    const segments = 24;
    const halfH = 36.0;
    const rMid = 25.5;
    const rPole = 5.2;

    for (let s = 0; s <= segments; s++) {
      const v = s / segments;
      const y = -halfH + v * (halfH * 2.0);
      const eta = y / halfH;
      const barrel = Math.pow(Math.max(0.0, 1.0 - eta * eta), 0.42);
      const baseR = rPole + (rMid - rPole) * barrel;
      const flute = 1.0 + 0.05 * Math.cos(8.0 * angle);
      const radius = baseR * flute + 0.35;
      pts.push(new THREE.Vector3(radius * Math.cos(angle), y, radius * Math.sin(angle)));
    }

    const curve = new THREE.CatmullRomCurve3(pts);
    const ribMat = new THREE.MeshStandardMaterial({
      color: P.primaryGlow,
      emissive: P.secondaryGlow,
      emissiveIntensity: 2.6,
      roughness: 0.2
    });
    const ribMesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 20, 0.48, 6, false), ribMat);
    ctenoRibGroup.add(ribMesh);
    ctenoRibs.push({ mesh: ribMesh, curve, angle, points: pts, mat: ribMat });

    const BEADS_COUNT = 12;
    for (let b = 1; b < BEADS_COUNT; b++) {
      const u = b / BEADS_COUNT;
      const pt = curve.getPointAt(u);
      const beadMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: new THREE.Color(P.primaryGlow),
        emissiveIntensity: 3.5,
        roughness: 0.1
      });
      const bead = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.55, 0.95), beadMat);
      bead.position.copy(pt);
      bead.lookAt(new THREE.Vector3(0, pt.y, 0));
      ctenoRibGroup.add(bead);
      ctenoBeads.push({ mesh: bead, mat: beadMat, u, ribIndex: r, baseY: pt.y });
    }
  }

  const radialCanalGroup = new THREE.Group();
  centerFlower.add(radialCanalGroup);

  const canalMat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(P.coreLineColor),
    emissive: new THREE.Color(P.coreLineEmissive),
    emissiveIntensity: 1.4,
    roughness: 0.25
  });

  for (let r = 0; r < 8; r++) {
    const angle = (r / 8) * TAU;
    const canalCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(Math.cos(angle) * 12.0, 0, Math.sin(angle) * 12.0),
      new THREE.Vector3(Math.cos(angle) * 25.5, 0, Math.sin(angle) * 25.5)
    ]);
    const canalMesh = new THREE.Mesh(
      new THREE.TubeGeometry(canalCurve, 12, 0.32, 6, false),
      canalMat
    );
    radialCanalGroup.add(canalMesh);
  }

  const CTENO_SILK_SEGS = 22;
  const ctenoSilkStartY = -36.0;
  const ctenoSilkPts = [];
  for (let j = 0; j <= CTENO_SILK_SEGS; j++) {
    ctenoSilkPts.push(new THREE.Vector3(0, ctenoSilkStartY - j * 5.8, 0));
  }
  const ctenoSilkCurve = new THREE.CatmullRomCurve3(ctenoSilkPts);
  const ctenoSilkMat = makeGlowTubeMaterial(P.coreLineColor, 2.6, 14, 2.5, 0, 1.4, 1.0);
  const ctenoSilkMesh = new THREE.Mesh(
    new THREE.TubeGeometry(ctenoSilkCurve, 48, 0.48, 6, false),
    ctenoSilkMat
  );
  centerFlower.add(ctenoSilkMesh);

  const ctenoSilkTipBead = new THREE.Mesh(
    new THREE.SphereGeometry(1.5, 10, 10),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  centerFlower.add(ctenoSilkTipBead);

  // Bell membranes
  const bellGradientMat = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.clone(bellGradientShader.uniforms),
    vertexShader: bellGradientShader.vertexShader,
    fragmentShader: bellGradientShader.fragmentShader,
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false,
    blending: THREE.NormalBlending
  });
  bellGradientMat.uniforms.uColorBase.value.set(P.membraneBase);
  bellGradientMat.uniforms.uColorRim.value.set(P.membraneRim);
  bellGradientMat.uniforms.uColorCore.value.set(P.membraneCore);

  const beadOuterMat = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(P.membraneCore),
    emissive: new THREE.Color(P.beadEmissive),
    emissiveIntensity: 3.6,
    roughness: 0.08,
    transmission: 0.35,
    clearcoat: 1.0
  });
  const beadCoreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

  const BEADS_PER_BELL = 20;
  const NUM_RIBS = 8;

  function buildBellAssembly(isTop) {
    const bellGroup = new THREE.Group();
    const sign = isTop ? 1 : -1;

    const membraneGeo = createWavyBellGeometry(isTop);
    const membraneMesh = new THREE.Mesh(membraneGeo, bellGradientMat);
    bellGroup.add(membraneMesh);

    const ribsGroup = new THREE.Group();
    bellGroup.add(ribsGroup);
    const ribList = [];

    for (let k = 0; k < NUM_RIBS; k++) {
      const angle = (k / NUM_RIBS) * TAU;
      const pts = [];
      const RIB_SEGS = 12;
      for (let j = 0; j <= RIB_SEGS; j++) {
        const u = j / RIB_SEGS;
        const baseR = 5.2 + (78.0 - 5.2) * Math.pow(u, 1.25);
        const waveFactor = Math.pow(u, 2.4);
        const waveR = 5.4 * Math.sin(angle * 16) + 1.8 * Math.sin(angle * 32);
        const waveY = 3.8 * Math.cos(angle * 16);
        const yOffset = 58.0 * Math.pow(u, 1.34);
        const r = Math.max(1.0, baseR + waveFactor * waveR);
        const y = sign * 52 + sign * (yOffset + waveFactor * waveY);
        pts.push(new THREE.Vector3(r * Math.cos(angle), y, r * Math.sin(angle)));
      }
      const curve = new THREE.CatmullRomCurve3(pts);
      const ribMat = makeGlowTubeMaterial(P.coreLineColor, 2.2, 2.4, 3.0, angle, 1.25, 1.0);
      const ribMesh = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 32, 0.35, 6, false),
        ribMat
      );
      ribsGroup.add(ribMesh);
      ribList.push({ mesh: ribMesh, mat: ribMat, baseAngle: angle });
    }

    const beadsGroup = new THREE.Group();
    bellGroup.add(beadsGroup);
    const beadsData = [];

    for (let b = 0; b < BEADS_PER_BELL; b++) {
      const angle = (b / BEADS_PER_BELL) * TAU;
      const baseR = 78.0;
      const waveR = 5.4 * Math.sin(angle * 16) + 1.8 * Math.sin(angle * 32);
      const waveY = 3.8 * Math.cos(angle * 16);
      const r = baseR + waveR;
      const y = sign * 52 + sign * (58.0 + waveY);
      const pos = new THREE.Vector3(r * Math.cos(angle), y, r * Math.sin(angle));

      const beadContainer = new THREE.Group();
      beadContainer.position.copy(pos);

      const outerSphere = new THREE.Mesh(new THREE.SphereGeometry(2.6, 12, 12), beadOuterMat);
      const innerSpark = new THREE.Mesh(new THREE.SphereGeometry(1.1, 8, 8), beadCoreMat);
      beadContainer.add(outerSphere, innerSpark);

      beadsGroup.add(beadContainer);
      beadsData.push({ container: beadContainer, angle, basePos: pos.clone() });
    }

    const rimLight = new THREE.PointLight(P.beadLight, 48, 340, 2);
    rimLight.position.set(0, sign * 85, 0);
    bellGroup.add(rimLight);

    return { group: bellGroup, membraneMesh, membraneGeo, ribList, beadsGroup, beadsData, rimLight, isTop };
  }

  const upperBell = buildBellAssembly(true);
  const lowerBell = buildBellAssembly(false);
  root.add(upperBell.group);
  root.add(lowerBell.group);

  // Tentacles
  const tentacleTipMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const tentacles = [];
  const TENTACLE_SEGS = 16;
  const TENTACLE_LENGTH = 118.0;

  function createTentacles(isTop) {
    const sign = isTop ? 1 : -1;
    const tGroup = new THREE.Group();
    root.add(tGroup);

    for (let m = 0; m < 4; m++) {
      const baseAngle = m * (Math.PI / 2) + Math.PI / 4;
      const startY = sign * 52.0;
      const startR = 8.5;
      const points = [];

      for (let j = 0; j <= TENTACLE_SEGS; j++) {
        const s = j / TENTACLE_SEGS;
        const r = startR + Math.sin(s * Math.PI * 0.5) * 48.0 + s * 26.0;
        const y = startY + sign * (s * TENTACLE_LENGTH);
        points.push(new THREE.Vector3(r * Math.cos(baseAngle), y, r * Math.sin(baseAngle)));
      }

      const curve = new THREE.CatmullRomCurve3(points);
      const mat = makeGlowTubeMaterial(P.tentacleColor, 2.2, 14, 2.8, baseAngle, 1.35, 0.94);
      const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, 0.75, 6, false), mat);
      tGroup.add(mesh);

      const tipPearl = new THREE.Mesh(new THREE.SphereGeometry(1.3, 8, 8), tentacleTipMat);
      tipPearl.position.copy(points[TENTACLE_SEGS]);
      tGroup.add(tipPearl);

      tentacles.push({ mesh, mat, tipPearl, isTop, sign, baseAngle, startY, startR, points });
    }
  }

  createTentacles(true);
  createTentacles(false);

  // -------------------------------------------------------------
  // Dynamic Kinematics & Autonomous Movement State
  // -------------------------------------------------------------
  const state = {
    pos: spawnPos.clone(),
    vel: initialHeading.clone().multiplyScalar(0.7),
    time: Math.random() * 20,
    seed: Math.random() * 100,
    pulseCycle: Math.random() * TAU,
    burstTime: 0,
    burstEnergy: 0,
    waveAmplitude: 1.0,
    expandUpper: 1.0,
    expandLower: 1.0,
    spineBreathingScale: 1.0,
    glowIntensity: 240
  };

  const desired = new THREE.Vector3();
  const forwardVec = new THREE.Vector3();
  const targetQuat = new THREE.Quaternion();

  function update(dt) {
    state.time += dt;

    // Burst decay and smooth energy transition
    if (state.burstTime > 0) {
      state.burstTime = Math.max(0, state.burstTime - dt);
    }
    const targetEnergy = state.burstTime > 0 ? 1 : 0;
    const easeRate = targetEnergy > state.burstEnergy ? 5.0 : 1.0;
    state.burstEnergy += (targetEnergy - state.burstEnergy) * (1 - Math.exp(-easeRate * dt));

    const burstK = state.burstEnergy;

    // Rhythmic pulse propulsion: contractions produce jet impulses
    const pulseSpeed = 1.1 + burstK * 2.4;
    state.pulseCycle += dt * pulseSpeed;
    const strokePhase = Math.sin(state.pulseCycle);
    const impulse = Math.max(0, -strokePhase); // contraction impulse

    // Autonomous 3D fluid wander field
    const t = state.time;
    const s = state.seed;
    const wx = Math.sin(t * 0.22 + s) * 0.65
             + Math.sin(t * 0.11 + s * 1.7) * 0.35
             + Math.sin(t * 0.43 + s * 2.8) * 0.20;
    const wy = Math.sin(t * 0.16 + s * 0.7) * 0.45
             + Math.sin(t * 0.08 + s * 1.9) * 0.25;
    const wz = Math.cos(t * 0.19 + s * 1.3) * 0.65
             + Math.cos(t * 0.12 + s * 2.5) * 0.35
             + Math.cos(t * 0.38 + s * 3.1) * 0.20;

    desired.set(wx, wy, wz);

    // Soft boundary steering: natural curve back to cave center
    const rXZ = Math.hypot(state.pos.x, state.pos.z);
    if (rXZ > BOUNDS_XZ * 0.65) {
      const edgeFactor = THREE.MathUtils.smoothstep(rXZ, BOUNDS_XZ * 0.65, BOUNDS_XZ * 0.98);
      desired.x = THREE.MathUtils.lerp(desired.x, -state.pos.x / rXZ * 1.6, edgeFactor);
      desired.z = THREE.MathUtils.lerp(desired.z, -state.pos.z / rXZ * 1.6, edgeFactor);
    }

    const absY = Math.abs(state.pos.y);
    if (absY > BOUNDS_Y * 0.65) {
      const edgeY = THREE.MathUtils.smoothstep(absY, BOUNDS_Y * 0.65, BOUNDS_Y * 0.96);
      const signY = state.pos.y >= 0 ? 1 : -1;
      desired.y = THREE.MathUtils.lerp(desired.y, -signY * 1.4, edgeY);
    }

    // Creature separation avoidance
    jellyfishList.forEach(other => {
      if (other.state === state) return;
      const d = state.pos.clone().sub(other.state.pos);
      const dist = d.length();
      if (dist > 0.001 && dist < MIN_SEPARATION) {
        const repulse = (1.0 - dist / MIN_SEPARATION) * 1.3;
        desired.add(d.normalize().multiplyScalar(repulse));
      }
    });

    if (desired.lengthSq() < 1e-5) desired.set(0, 0.2, 1);
    desired.normalize();

    // Speed calculation: leisurely cruise to overdrive burst
    const cruiseSpeed = 0.65 + 0.25 * Math.sin(t * 0.3 + s);
    const targetSpeed = cruiseSpeed * (1.0 + impulse * 0.5) + (3.4 - cruiseSpeed) * burstK;
    desired.multiplyScalar(targetSpeed);

    // Apply fluid viscosity damping and steer force
    const steerSmoothing = 1 - Math.exp(-2.2 * dt);
    state.vel.lerp(desired, steerSmoothing);

    const maxSpeed = 1.3 + 3.2 * burstK;
    if (state.vel.length() > maxSpeed) state.vel.setLength(maxSpeed);

    // Update position
    state.pos.addScaledVector(state.vel, dt * 75);

    // Hard boundary safety clamp with soft return
    const maxR = BOUNDS_XZ * 1.05;
    const curR = Math.hypot(state.pos.x, state.pos.z);
    if (curR > maxR) {
      state.pos.x *= maxR / curR;
      state.pos.z *= maxR / curR;
    }
    state.pos.y = THREE.MathUtils.clamp(state.pos.y, -BOUNDS_Y * 1.05, BOUNDS_Y * 1.05);

    // Locomotion expansion and breathing
    state.expandUpper = THREE.MathUtils.mapLinear(Math.sin(state.pulseCycle), -1, 1, 0.88, 1.18 + burstK * 0.12);
    state.expandLower = THREE.MathUtils.mapLinear(Math.cos(state.pulseCycle), -1, 1, 0.88, 1.18 + burstK * 0.12);
    state.spineBreathingScale = THREE.MathUtils.mapLinear(Math.sin(state.pulseCycle * 1.5), -1, 1, 0.94, 1.06);
    state.waveAmplitude = 0.95 + burstK * 0.9;
    state.glowIntensity = THREE.MathUtils.mapLinear(Math.sin(t * 2.2), -1, 1, 220, 270) + burstK * 120;
  }

  function animate(t, dt) {
    root.position.copy(state.pos);

    // Organic 3D orientation alignment:
    // Creature aligns along movement direction in full 3D (pitch, yaw, roll)
    const speed = state.vel.length();
    forwardVec.copy(state.vel);
    if (forwardVec.lengthSq() > 1e-5) forwardVec.normalize();
    else forwardVec.set(0, 1, 0);

    const burstK = state.burstEnergy;
    // In calm swim, creature maintains gentle vertical buoyancy bias; in burst, fully streamlines
    const buoyancyBias = THREE.MathUtils.clamp(1.0 - speed * 0.8, 0.0, 0.55) * (1.0 - burstK);
    const swimDir = new THREE.Vector3(
      forwardVec.x,
      forwardVec.y + (forwardVec.y >= 0 ? 0.4 : -0.4) * buoyancyBias,
      forwardVec.z
    ).normalize();

    targetQuat.setFromUnitVectors(new THREE.Vector3(0, 1, 0), swimDir);

    // Subtle natural aquatic wobble
    const wobblePitch = Math.sin(t * 0.9 + state.seed) * (0.05 + 0.03 * burstK);
    const wobbleRoll = Math.cos(t * 0.75 + state.seed * 1.3) * (0.05 + 0.03 * burstK);
    const wobbleYaw = Math.sin(t * 0.35 + state.seed * 2.1) * 0.08;
    const wobbleQuat = new THREE.Quaternion().setFromEuler(
      new THREE.Euler(wobblePitch, wobbleYaw, wobbleRoll, 'YXZ')
    );
    targetQuat.multiply(wobbleQuat);

    root.quaternion.slerp(targetQuat, 1.0 - Math.exp(-3.2 * dt));

    const breathY = state.spineBreathingScale;
    const spineAmp = 3.2 * (0.78 + 0.4 * state.waveAmplitude);

    spineGlowMat.uniforms.uTime.value = t;
    spineGlowMat.uniforms.uScaleY.value = breathY;
    spineGlowMat.uniforms.uAmp.value = spineAmp;

    spineSheathMat.uniforms.uTime.value = t;
    spineSheathMat.uniforms.uScaleY.value = breathY;
    spineSheathMat.uniforms.uAmp.value = spineAmp;

    archStruts.forEach(strut => {
      const bowFactor = 1.0 + (1.2 - breathY) * 1.5;
      strut.mesh.scale.set(bowFactor, breathY, bowFactor);
    });

    spineNodes.scale.set(1.0, breathY, 1.0);

    upperBell.group.position.y = 52 * breathY - 52;
    lowerBell.group.position.y = -52 * breathY + 52;
    upperBell.group.scale.set(state.expandUpper, 1.0 / Math.sqrt(state.expandUpper), state.expandUpper);
    lowerBell.group.scale.set(state.expandLower, 1.0 / Math.sqrt(state.expandLower), state.expandLower);

    const waveTime = t * 3.0;
    [upperBell, lowerBell].forEach(bell => {
      const posAttr = bell.membraneGeo.attributes.position;
      const basePos = bell.membraneGeo.userData.basePositions;
      const count = posAttr.count;

      for (let i = 0; i < count; i++) {
        const u = bell.membraneGeo.attributes.uv.getX(i);
        const v = bell.membraneGeo.attributes.uv.getY(i);
        const angle = v * TAU;

        if (u > 0.25) {
          const waveU = Math.pow(u, 2.4);
          const ripple = Math.sin(angle * 16 - waveTime) * 1.8 * state.waveAmplitude * waveU;
          const rippleY = Math.cos(angle * 16 - waveTime) * 1.3 * state.waveAmplitude * waveU;
          posAttr.setX(i, basePos[i * 3] + Math.cos(angle) * ripple);
          posAttr.setY(i, basePos[i * 3 + 1] + (bell.isTop ? rippleY : -rippleY));
          posAttr.setZ(i, basePos[i * 3 + 2] + Math.sin(angle) * ripple);
        }
      }
      posAttr.needsUpdate = true;

      bell.ribList.forEach(rib => {
        rib.mat.uniforms.uTime.value = t;
        rib.mat.uniforms.uAmp.value = 2.4 * (0.78 + 0.4 * state.waveAmplitude);
      });

      bell.beadsData.forEach(bData => {
        const p = 1.0 + 0.16 * Math.sin(t * 3.8 + bData.angle * 4.0);
        bData.container.scale.setScalar(p);
      });
    });

    tentacles.forEach(tentacle => {
      const mat = tentacle.mat;
      const amp = 14 * (0.75 + 0.35 * state.waveAmplitude);
      mat.uniforms.uTime.value = t;
      mat.uniforms.uAmp.value = amp;

      const sp = mat.uniforms.uSpeed.value;
      const ph = tentacle.baseAngle;
      const w1 = Math.sin(t * sp + 9.42478 + ph);
      const w2 = Math.cos(t * sp * 0.73 + 6.28318 + ph * 1.7);
      const w3 = Math.sin(t * sp * 0.51 + 3.14159 + ph * 0.6);
      const base = tentacle.points[TENTACLE_SEGS];
      tentacle.tipPearl.position.set(
        base.x + w1 * amp,
        base.y + w3 * amp * 0.30,
        base.z + w2 * amp * 0.78
      );
    });

    const ctenoPulseSpeed = 1.0 + burstK * 2.2;
    ctenophoreMembraneMat.uniforms.uTime.value = t;
    ctenophoreMembraneMat.uniforms.uPulseSpeed.value = ctenoPulseSpeed;
    ctenophoreMembraneMat.uniforms.uDiffractionIntensity.value = 1.0 + burstK * 0.6;

    const capsuleBreath = 1.0 + 0.035 * Math.sin(t * 2.5);
    ctenophoreCapsuleMesh.scale.set(capsuleBreath, breathY, capsuleBreath);
    ctenoRibGroup.scale.set(capsuleBreath, breathY, capsuleBreath);
    radialCanalGroup.scale.set(capsuleBreath, 1.0, capsuleBreath);

    ctenoRibs.forEach(rib => {
      writeSpectrumColor(rib.mat.emissive, t * 0.95 * ctenoPulseSpeed + rib.angle * 0.12);
    });

    ctenoBeads.forEach(b => {
      const phase = t * 1.3 * ctenoPulseSpeed - b.u * 2.2 + b.ribIndex * 0.125;
      writeSpectrumColor(b.mat.emissive, phase);
      const pulseScale = 1.0 + 0.45 * Math.pow(Math.max(0.0, Math.sin(phase * TAU)), 2.0);
      b.mesh.scale.set(pulseScale, pulseScale, pulseScale);
    });

    const silkAmp = 13 * (0.75 + 0.35 * state.waveAmplitude);
    ctenoSilkMat.uniforms.uTime.value = t;
    ctenoSilkMat.uniforms.uAmp.value = silkAmp;

    const silkSpeed = ctenoSilkMat.uniforms.uSpeed.value;
    const sw1 = Math.sin(t * silkSpeed + 9.42478);
    const sw2 = Math.cos(t * silkSpeed * 0.73 + 6.28318);
    const sw3 = Math.sin(t * silkSpeed * 0.51 + 3.14159);
    const silkBase = ctenoSilkPts[CTENO_SILK_SEGS];
    ctenoSilkTipBead.position.set(
      silkBase.x + sw1 * silkAmp,
      silkBase.y + sw3 * silkAmp * 0.30,
      silkBase.z + sw2 * silkAmp * 0.78
    );

    bellGradientMat.uniforms.uTime.value = t;
    bellGradientMat.uniforms.uWaveAmp.value = state.waveAmplitude;

    const lumenRatio = state.glowIntensity / 255.0;
    bioLightCenter.intensity = 42 * lumenRatio;
    upperBell.rimLight.intensity = 48 * lumenRatio;
    lowerBell.rimLight.intensity = 48 * lumenRatio;
  }

  function burst() {
    state.burstTime = 4.8; // High-speed surge duration
    // Scatter & propel along current velocity heading
    const scatter = new THREE.Vector3();
    jellyfishList.forEach(other => {
      if (other.state === state) return;
      const d = state.pos.clone().sub(other.state.pos);
      const len = d.length();
      if (len > 0.001) scatter.add(d.multiplyScalar(1 / (len * len)));
    });
    if (scatter.lengthSq() > 1e-6) state.vel.add(scatter.setLength(0.65));
    if (state.vel.lengthSq() > 1e-5) state.vel.add(state.vel.clone().normalize().multiplyScalar(1.2));
  }

  return {
    root,
    state,
    update,
    animate,
    burst,
    isBursting: () => state.burstEnergy > 0.05
  };
}

// 【泥炭發酵蠕蟲】(Peat Fermentation Worm)
// 多節段幾何軟體 / 無血紅素銅基半透明生物 / 星狀化學感受器 / 硫磺結晶沉澱
// =============================================================

const peatWormSkinShader = {
  uniforms: {
    uTime: { value: 0 },
    uColorBase: { value: new THREE.Color(0x0a3820) },    // Translucent Jade green
    uColorRim: { value: new THREE.Color(0x4ade80) },     // Milky emerald rim Fresnel
    uColorFluid: { value: new THREE.Color(0x22c55e) },   // Flowing copper-protein fluid
    uBurstK: { value: 0.0 }
  },
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vViewPosition;
    varying vec3 vWorldPosition;
    varying vec2 vUv;

    void main() {
      vUv = uv;
      vNormal = normalize(normalMatrix * normal);
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      vViewPosition = -mvPosition.xyz;
      vWorldPosition = (modelMatrix * vec4(position, 1.0)).xyz;
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uColorBase;
    uniform vec3 uColorRim;
    uniform vec3 uColorFluid;
    uniform float uBurstK;

    varying vec3 vNormal;
    varying vec3 vViewPosition;
    varying vec3 vWorldPosition;
    varying vec2 vUv;

    void main() {
      vec3 N = normalize(vNormal);
      vec3 V = normalize(vViewPosition);
      float NdotV = abs(dot(N, V));

      // Thin bio-glass slime sheath Fresnel (生物琉璃黏液薄膜)
      float fresnel = pow(clamp(1.0 - NdotV, 0.0, 1.0), 2.2);

      // Annular muscular segment ridges (42 個緊密環狀肌肉節段)
      float segFrac = fract(vUv.x * 42.0);
      float ridge = smoothstep(0.06, 0.5, segFrac) * smoothstep(0.94, 0.5, segFrac);
      float groove = 1.0 - smoothstep(0.0, 0.14, min(segFrac, 1.0 - segFrac));

      // Translucent Jade body tone with copper-protein fluid
      vec3 jade = mix(uColorBase, uColorFluid, 0.45 + 0.35 * ridge);
      jade = mix(jade, uColorRim, fresnel * 0.92);

      // Semi-fluid bio-glass slime sheath (高光琉璃濕潤黏液)
      float slimeSheen = pow(fresnel, 3.6) * 2.4;
      vec3 slimeColor = vec3(0.80, 1.0, 0.90) * slimeSheen;

      // Darkened constriction in the annular grooves
      jade *= (1.0 - groove * 0.35);

      // Faint chemiluminescent pulse in copper-based lymph fluid
      float chemPulse = 0.5 + 0.5 * sin(uTime * 3.2 - vUv.x * 14.0);
      vec3 chemGlow = uColorRim * chemPulse * (0.45 + 0.85 * uBurstK);

      vec3 finalCol = jade + slimeColor + chemGlow;
      // High translucency so internal inky gut and peat boluses shine through clearly!
      float alpha = 0.32 + 0.52 * fresnel + 0.10 * (1.0 - ridge);
      alpha = clamp(alpha, 0.0, 0.86);

      gl_FragColor = vec4(finalCol, alpha);
    }
  `
};

const fermentationGutShader = {
  uniforms: {
    uTime: { value: 0 },
    uColorGut: { value: new THREE.Color(0x021609) },     // Inky deep forest black-green
    uColorPeat: { value: new THREE.Color(0x000501) },    // Digesting black peat sludge
    uColorMethane: { value: new THREE.Color(0xa3e635) }, // Fermenting methane / sulfur chemical glow
    uBurstK: { value: 0.0 }
  },
  vertexShader: `
    varying vec3 vNormal;
    varying vec2 vUv;
    varying vec3 vViewPosition;

    void main() {
      vUv = uv;
      vNormal = normalize(normalMatrix * normal);
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      vViewPosition = -mvPosition.xyz;
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uColorGut;
    uniform vec3 uColorPeat;
    uniform vec3 uColorMethane;
    uniform float uBurstK;

    varying vec3 vNormal;
    varying vec2 vUv;
    varying vec3 vViewPosition;

    void main() {
      // Peristaltic sludge boluses traveling along gut (蠕動波吞食泥炭)
      float bolusWave = sin(uTime * 3.0 - vUv.x * 18.0);
      float bolus = smoothstep(0.20, 0.80, bolusWave * 0.5 + 0.5);

      // Digesting black peat chunks and sulfurous fermentation gas
      vec3 gutBase = mix(uColorGut, uColorPeat, bolus * 0.8);

      // Micro methane / sulfur pockets with chemical luminescence
      float methanePulse = pow(clamp(sin(uTime * 4.5 - vUv.x * 28.0), 0.0, 1.0), 2.5);
      vec3 methaneGlow = uColorMethane * methanePulse * (1.1 + 1.8 * uBurstK);

      vec3 finalCol = gutBase + methaneGlow;
      gl_FragColor = vec4(finalCol, 0.98);
    }
  `
};

function createPeatFermentationWorm(spawnPos) {
  const root = new THREE.Group();
  scene.add(root);

  const NUM_NODES = 42;
  const RADIAL_SEGS = 16;
  const SEG_LEN = 5.4; // Total length ~230 units

  // Initialize spine chain spread out laterally for prominent visibility
  const nodes = [];
  for (let i = 0; i <= NUM_NODES; i++) {
    nodes.push(new THREE.Vector3(
      spawnPos.x - i * SEG_LEN * 0.85,
      spawnPos.y + Math.sin(i * 0.25) * 6.0,
      spawnPos.z + i * SEG_LEN * 0.35
    ));
  }

  // Pre-calculate indices for outer skin and inner gut
  const vertCount = (NUM_NODES + 1) * (RADIAL_SEGS + 1);
  const skinPositions = new Float32Array(vertCount * 3);
  const skinNormals = new Float32Array(vertCount * 3);
  const skinUvs = new Float32Array(vertCount * 2);

  const gutPositions = new Float32Array(vertCount * 3);
  const gutNormals = new Float32Array(vertCount * 3);
  const gutUvs = new Float32Array(vertCount * 2);

  const indices = [];
  for (let i = 0; i < NUM_NODES; i++) {
    for (let j = 0; j < RADIAL_SEGS; j++) {
      const a = i * (RADIAL_SEGS + 1) + j;
      const b = (i + 1) * (RADIAL_SEGS + 1) + j;
      const c = (i + 1) * (RADIAL_SEGS + 1) + (j + 1);
      const d = i * (RADIAL_SEGS + 1) + (j + 1);
      indices.push(a, b, d);
      indices.push(b, c, d);
    }
  }

  // Initialize UVs
  for (let i = 0; i <= NUM_NODES; i++) {
    const u = i / NUM_NODES;
    for (let j = 0; j <= RADIAL_SEGS; j++) {
      const v = j / RADIAL_SEGS;
      const idx = (i * (RADIAL_SEGS + 1) + j) * 2;
      skinUvs[idx] = u;
      skinUvs[idx + 1] = v;
      gutUvs[idx] = u;
      gutUvs[idx + 1] = v;
    }
  }

  const skinGeo = new THREE.BufferGeometry();
  skinGeo.setAttribute('position', new THREE.BufferAttribute(skinPositions, 3));
  skinGeo.setAttribute('normal', new THREE.BufferAttribute(skinNormals, 3));
  skinGeo.setAttribute('uv', new THREE.BufferAttribute(skinUvs, 2));
  skinGeo.setIndex(indices);

  const skinMat = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.clone(peatWormSkinShader.uniforms),
    vertexShader: peatWormSkinShader.vertexShader,
    fragmentShader: peatWormSkinShader.fragmentShader,
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false,
    blending: THREE.NormalBlending
  });

  const skinMesh = new THREE.Mesh(skinGeo, skinMat);
  root.add(skinMesh);

  // Inner fermentation gut mesh
  const gutGeo = new THREE.BufferGeometry();
  gutGeo.setAttribute('position', new THREE.BufferAttribute(gutPositions, 3));
  gutGeo.setAttribute('normal', new THREE.BufferAttribute(gutNormals, 3));
  gutGeo.setAttribute('uv', new THREE.BufferAttribute(gutUvs, 2));
  gutGeo.setIndex(indices);

  const gutMat = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.clone(fermentationGutShader.uniforms),
    vertexShader: fermentationGutShader.vertexShader,
    fragmentShader: fermentationGutShader.fragmentShader,
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false,
    blending: THREE.NormalBlending
  });

  const gutMesh = new THREE.Mesh(gutGeo, gutMat);
  root.add(gutMesh);

  // Head Assembly (Eyeless, Star-shaped Chemoreceptor Mouth + 8 Palps)
  const headGroup = new THREE.Group();
  root.add(headGroup);

  // Star cleft rim: 6-pointed star cavity
  const starCleftGroup = new THREE.Group();
  headGroup.add(starCleftGroup);

  const starRidgeMat = new THREE.MeshStandardMaterial({
    color: 0x052e16,
    emissive: 0x14532d,
    emissiveIntensity: 0.9,
    roughness: 0.35
  });

  for (let k = 0; k < 6; k++) {
    const ang = (k / 6) * TAU;
    const foldMesh = new THREE.Mesh(new THREE.ConeGeometry(1.2, 4.0, 4), starRidgeMat);
    foldMesh.position.set(Math.cos(ang) * 2.2, Math.sin(ang) * 2.2, -1.2);
    foldMesh.rotation.z = ang - Math.PI / 2;
    foldMesh.rotation.x = -Math.PI / 2;
    starCleftGroup.add(foldMesh);
  }

  // 8 Chemosensory Palps around the star mouth
  const palps = [];
  const palpMat = makeGlowTubeMaterial(0x86efac, 2.5, 1.4, 4.2, 0, 1.0, 0.95);
  const palpTipMat = new THREE.MeshBasicMaterial({ color: 0xdcfce7 });

  for (let k = 0; k < 8; k++) {
    const ang = (k / 8) * TAU;
    const palpBase = new THREE.Group();
    headGroup.add(palpBase);

    // Palp curve extending forward and outward
    const pts = [
      new THREE.Vector3(Math.cos(ang) * 3.6, Math.sin(ang) * 3.6, 0),
      new THREE.Vector3(Math.cos(ang) * 5.4, Math.sin(ang) * 5.4, 5.2),
      new THREE.Vector3(Math.cos(ang) * 6.8, Math.sin(ang) * 6.8, 10.2)
    ];
    const curve = new THREE.CatmullRomCurve3(pts);
    const pMesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 10, 0.36, 6, false), palpMat);
    palpBase.add(pMesh);

    const tipPearl = new THREE.Mesh(new THREE.SphereGeometry(0.72, 8, 8), palpTipMat);
    tipPearl.position.copy(pts[2]);
    palpBase.add(tipPearl);

    palps.push({ baseGroup: palpBase, baseAngle: ang, pts, pMesh, tipPearl });
  }

  // Sulfur Crystals (Solid yellow sulfur granules adhering to flanks and tail)
  const sulfurCrystals = [];
  const crystalMat = new THREE.MeshStandardMaterial({
    color: 0xfde047,
    roughness: 0.22,
    metalness: 0.48,
    emissive: new THREE.Color(0xb45309),
    emissiveIntensity: 1.15
  });

  // Internal Visceral Light for the Jade Worm
  const wormBioLight = new THREE.PointLight(0x4ade80, 24, 220, 2.0);
  root.add(wormBioLight);

  const NUM_CRYSTALS = 36;
  for (let c = 0; c < NUM_CRYSTALS; c++) {
    // 22 on lateral flanks (nodes 8-32), 14 on posterior tail (nodes 33-41)
    const isTail = c >= 22;
    const nodeIdx = isTail
      ? Math.floor(THREE.MathUtils.randFloat(33, 41))
      : Math.floor(THREE.MathUtils.randFloat(8, 32));

    // Flanks: angle ~ ±PI/2; Tail: full circle
    const flankSign = (c % 2 === 0) ? 1 : -1;
    const latAngle = isTail
      ? Math.random() * TAU
      : flankSign * (Math.PI * 0.5) + THREE.MathUtils.randFloat(-0.35, 0.35);

    const scale = THREE.MathUtils.randFloat(1.3, 2.4);
    const crystalMesh = new THREE.Mesh(new THREE.OctahedronGeometry(scale, 0), crystalMat);
    root.add(crystalMesh);

    sulfurCrystals.push({
      mesh: crystalMesh,
      nodeIdx,
      latAngle,
      scale,
      rotOffset: new THREE.Euler(Math.random() * TAU, Math.random() * TAU, Math.random() * TAU)
    });
  }

  // Chemical Methane / Sulfur Micro-Motes (Exudate particles)
  const MOTE_COUNT = 75;
  const motePos = new Float32Array(MOTE_COUNT * 3);
  const moteData = [];
  for (let m = 0; m < MOTE_COUNT; m++) {
    motePos[m * 3] = spawnPos.x;
    motePos[m * 3 + 1] = spawnPos.y;
    motePos[m * 3 + 2] = spawnPos.z;
    moteData.push({
      life: Math.random(),
      speedY: THREE.MathUtils.randFloat(0.18, 0.52),
      driftX: THREE.MathUtils.randFloat(-0.25, 0.25),
      driftZ: THREE.MathUtils.randFloat(-0.25, 0.25)
    });
  }
  const moteGeo = new THREE.BufferGeometry();
  moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
  const moteMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0xa3e635) } },
    vertexShader: `
      uniform float uTime;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = max(1.2, 3.8 * (240.0 / -mv.z));
      }
    `,
    fragmentShader: `
      uniform vec3 uColor;
      void main() {
        vec2 c = gl_PointCoord - 0.5;
        if (length(c) > 0.5) discard;
        float a = smoothstep(0.5, 0.05, length(c)) * 0.65;
        gl_FragColor = vec4(uColor * 1.6, a);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const motePoints = new THREE.Points(moteGeo, moteMat);
  root.add(motePoints);

  // Dynamic worm state
  const state = {
    pos: spawnPos.clone(),
    vel: new THREE.Vector3(0.65, 0.05, 0.35),
    time: Math.random() * 20,
    seed: Math.random() * 100,
    burstTime: 0,
    burstEnergy: 0,
    peristalsisPhase: 0,
    serpentinePhase: 0
  };

  const headDesired = new THREE.Vector3();
  const upRef = new THREE.Vector3(0, 1, 0);

  function update(dt) {
    state.time += dt;

    if (state.burstTime > 0) {
      state.burstTime = Math.max(0, state.burstTime - dt);
    }
    const targetEnergy = state.burstTime > 0 ? 1 : 0;
    const easeRate = targetEnergy > state.burstEnergy ? 4.8 : 1.0;
    state.burstEnergy += (targetEnergy - state.burstEnergy) * (1 - Math.exp(-easeRate * dt));

    const burstK = state.burstEnergy;

    // Movement rates
    const serpRate = 2.4 + burstK * 4.6;
    state.serpentinePhase += dt * serpRate;
    state.peristalsisPhase += dt * (2.8 + burstK * 4.2);

    // Head 3D steering in lower cavern
    const t = state.time;
    const s = state.seed;
    const hx = Math.sin(t * 0.20 + s) * 0.75 + Math.sin(t * 0.09 + s * 1.6) * 0.35;
    const hy = Math.sin(t * 0.14 + s * 0.8) * 0.35 + Math.sin(t * 0.06 + s * 2.2) * 0.22;
    const hz = Math.cos(t * 0.18 + s * 1.2) * 0.75 + Math.cos(t * 0.10 + s * 2.7) * 0.35;

    headDesired.set(hx, hy, hz);

    // Soft boundary containment in bottom cavern
    const curR = Math.hypot(state.pos.x, state.pos.z);
    if (curR > 340 * 0.65) {
      const edgeFactor = THREE.MathUtils.smoothstep(curR, 340 * 0.65, 340 * 0.98);
      headDesired.x = THREE.MathUtils.lerp(headDesired.x, -state.pos.x / curR * 1.5, edgeFactor);
      headDesired.z = THREE.MathUtils.lerp(headDesired.z, -state.pos.z / curR * 1.5, edgeFactor);
    }

    // Keep worm in the lower-middle peat layer: Y in [-165, -50]
    const targetYCenter = -105;
    const dyFromCenter = state.pos.y - targetYCenter;
    if (Math.abs(dyFromCenter) > 42) {
      const edgeY = THREE.MathUtils.smoothstep(Math.abs(dyFromCenter), 42, 65);
      headDesired.y = THREE.MathUtils.lerp(headDesired.y, -Math.sign(dyFromCenter) * 1.2, edgeY);
    }

    headDesired.normalize();

    // Speed: crawling slow to rapid burst undulation
    const cruiseSpeed = 0.75 + 0.25 * Math.sin(t * 0.4 + s);
    const speed = cruiseSpeed + (3.4 - cruiseSpeed) * burstK;
    headDesired.multiplyScalar(speed);

    state.vel.lerp(headDesired, 1 - Math.exp(-2.5 * dt));
    state.pos.addScaledVector(state.vel, dt * 60);

    // Move Head (Node 0)
    nodes[0].copy(state.pos);

    // Follow-the-leader chain update with serpentine undulation wave
    const serpAmp = 1.6 + burstK * 0.9;
    for (let i = 1; i <= NUM_NODES; i++) {
      const prev = nodes[i - 1];
      const curr = nodes[i];

      const toPrev = new THREE.Vector3().subVectors(prev, curr);
      const dist = toPrev.length();
      if (dist > 1e-4) toPrev.normalize();
      else toPrev.set(0, 0, 1);

      // Lateral serpentine wave displacement
      const lateralVec = new THREE.Vector3().crossVectors(toPrev, upRef);
      if (lateralVec.lengthSq() > 1e-4) lateralVec.normalize();
      else lateralVec.set(1, 0, 0);

      const waveAngle = state.serpentinePhase - i * 0.32;
      const waveOffset = Math.sin(waveAngle) * serpAmp;

      const targetPos = prev.clone().sub(toPrev.multiplyScalar(SEG_LEN));
      targetPos.addScaledVector(lateralVec, waveOffset * dt * 32);

      curr.lerp(targetPos, 0.48);
    }

    // Update Exudate motes trailing behind
    const posAttr = moteGeo.attributes.position;
    for (let m = 0; m < MOTE_COUNT; m++) {
      moteData[m].life += dt * 0.55;
      if (moteData[m].life > 1.0) {
        moteData[m].life = 0;
        // Respawn near middle or tail
        const spawnIdx = Math.floor(THREE.MathUtils.randFloat(18, NUM_NODES));
        const spawnNode = nodes[spawnIdx];
        posAttr.setXYZ(m, spawnNode.x + THREE.MathUtils.randFloat(-2.5, 2.5), spawnNode.y + THREE.MathUtils.randFloat(-2.5, 2.5), spawnNode.z + THREE.MathUtils.randFloat(-2.5, 2.5));
      } else {
        const cx = posAttr.getX(m) + moteData[m].driftX * dt * 10;
        const cy = posAttr.getY(m) + moteData[m].speedY * dt * 15;
        const cz = posAttr.getZ(m) + moteData[m].driftZ * dt * 10;
        posAttr.setXYZ(m, cx, cy, cz);
      }
    }
    posAttr.needsUpdate = true;
  }

  function animate(t, dt) {
    const burstK = state.burstEnergy;

    // Update Head Orientation & Palp Twitching
    const headTangent = new THREE.Vector3().subVectors(nodes[0], nodes[1]);
    if (headTangent.lengthSq() > 1e-4) headTangent.normalize();
    else headTangent.set(0, 0, 1);

    headGroup.position.copy(nodes[0]);
    headGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), headTangent);

    // Active sensory palp twitching
    palps.forEach((palp, idx) => {
      const twitchSpeed = 4.5 + burstK * 6.0;
      const twitchAngleX = Math.sin(t * twitchSpeed + idx * 1.5) * (0.30 + 0.22 * burstK);
      const twitchAngleY = Math.cos(t * twitchSpeed * 0.8 + idx * 2.1) * (0.30 + 0.22 * burstK);
      palp.baseGroup.rotation.set(twitchAngleX, twitchAngleY, 0);
    });

    // Reconstruct Worm Skin and Gut Tube along dynamic spine nodes
    const skinPosAttr = skinGeo.attributes.position;
    const skinNormAttr = skinGeo.attributes.normal;
    const gutPosAttr = gutGeo.attributes.position;
    const gutNormAttr = gutGeo.attributes.normal;

    // Parallel transport frame initialization
    let curNormal = new THREE.Vector3(0, 1, 0);
    const tangents = [];
    const normals = [];
    const binormals = [];

    for (let i = 0; i <= NUM_NODES; i++) {
      let tang;
      if (i === 0) tang = new THREE.Vector3().subVectors(nodes[0], nodes[1]);
      else if (i === NUM_NODES) tang = new THREE.Vector3().subVectors(nodes[NUM_NODES - 1], nodes[NUM_NODES]);
      else tang = new THREE.Vector3().subVectors(nodes[i - 1], nodes[i + 1]);

      if (tang.lengthSq() > 1e-5) tang.normalize();
      else tang.set(0, 0, 1);
      tangents.push(tang);

      // Project curNormal onto orthogonal plane
      curNormal.sub(tang.clone().multiplyScalar(curNormal.dot(tang)));
      if (curNormal.lengthSq() > 1e-5) curNormal.normalize();
      else curNormal.set(0, 1, 0);
      normals.push(curNormal.clone());

      const binorm = new THREE.Vector3().crossVectors(tang, curNormal).normalize();
      binormals.push(binorm);
    }

    // Populate Skin and Gut geometry
    for (let i = 0; i <= NUM_NODES; i++) {
      const u = i / NUM_NODES;
      const P = nodes[i];
      const N_vec = normals[i];
      const B_vec = binormals[i];

      // Anatomical tapering profile:
      // Head (u=0) tapers gracefully; Tail (u=1) tapers to a slender blunt tip
      const taper = Math.sin(Math.pow(u, 0.65) * Math.PI);
      const baseR = 2.4 + 5.2 * taper;

      // Annular muscular ring bulges (42 環狀肌肉節段)
      const ringBulge = 1.0 + 0.18 * Math.sin(u * 42.0 * TAU);

      // Peristaltic traveling contraction wave (環狀肌蠕動波)
      const peristalsis = 1.0 + (0.24 + 0.14 * burstK) * Math.sin(state.peristalsisPhase - u * 18.0);

      const outerR = Math.max(1.0, baseR * ringBulge * peristalsis);
      const gutR = Math.max(0.48, outerR * 0.52);

      for (let j = 0; j <= RADIAL_SEGS; j++) {
        const v = j / RADIAL_SEGS;
        const theta = v * TAU;
        const cosT = Math.cos(theta);
        const sinT = Math.sin(theta);

        // Radial vector
        const radX = cosT * N_vec.x + sinT * B_vec.x;
        const radY = cosT * N_vec.y + sinT * B_vec.y;
        const radZ = cosT * N_vec.z + sinT * B_vec.z;

        const vertIdx = i * (RADIAL_SEGS + 1) + j;

        // Outer Skin Vertex
        skinPosAttr.setXYZ(vertIdx, P.x + outerR * radX, P.y + outerR * radY, P.z + outerR * radZ);
        skinNormAttr.setXYZ(vertIdx, radX, radY, radZ);

        // Inner Fermentation Gut Vertex
        gutPosAttr.setXYZ(vertIdx, P.x + gutR * radX, P.y + gutR * radY, P.z + gutR * radZ);
        gutNormAttr.setXYZ(vertIdx, radX, radY, radZ);
      }

      // Update attached Sulfur Crystals for this node
      sulfurCrystals.forEach(sc => {
        if (sc.nodeIdx === i) {
          const cosT = Math.cos(sc.latAngle);
          const sinT = Math.sin(sc.latAngle);
          const radX = cosT * N_vec.x + sinT * B_vec.x;
          const radY = cosT * N_vec.y + sinT * B_vec.y;
          const radZ = cosT * N_vec.z + sinT * B_vec.z;

          // Sit right on outer surface with crystal outward projection
          const surfaceR = outerR + 0.55;
          sc.mesh.position.set(P.x + surfaceR * radX, P.y + surfaceR * radY, P.z + surfaceR * radZ);
          sc.mesh.lookAt(P.x + (surfaceR + 10) * radX, P.y + (surfaceR + 10) * radY, P.z + (surfaceR + 10) * radZ);
          sc.mesh.rotation.z += sc.rotOffset.z;
        }
      });
    }

    skinPosAttr.needsUpdate = true;
    skinNormAttr.needsUpdate = true;
    gutPosAttr.needsUpdate = true;
    gutNormAttr.needsUpdate = true;

    // Update Material Uniforms & Internal Light
    skinMat.uniforms.uTime.value = t;
    skinMat.uniforms.uBurstK.value = burstK;
    gutMat.uniforms.uTime.value = t;
    gutMat.uniforms.uBurstK.value = burstK;
    moteMat.uniforms.uTime.value = t;

    // Center internal biolight along mid-abdomen (node 14)
    wormBioLight.position.copy(nodes[14]);
    wormBioLight.intensity = (22 + burstK * 28) * (0.85 + 0.15 * Math.sin(t * 3.0));
  }

  function burst() {
    state.burstTime = 4.8;
    if (state.vel.lengthSq() > 1e-4) {
      state.vel.normalize().multiplyScalar(1.2);
    }
  }

  return {
    root,
    state,
    update,
    animate,
    burst,
    isBursting: () => state.burstEnergy > 0.05
  };
}

// -------------------------------------------------------------
// Instantiate Peat Fermentation Worm in lower-middle cavern zone
// -------------------------------------------------------------
const peatWorm = createPeatFermentationWorm(new THREE.Vector3(60, -95, 75));

// -------------------------------------------------------------
// Web Audio Sub-Resonance Pulse (Ethereal Souls soundscape)
// -------------------------------------------------------------
let audioCtx = null;
function playBurstSound() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    const now = audioCtx.currentTime;
    
    // Low frequency sub-rumble
    const subOsc = audioCtx.createOscillator();
    const subGain = audioCtx.createGain();
    subOsc.type = 'sine';
    subOsc.frequency.setValueAtTime(55, now);
    subOsc.frequency.exponentialRampToValueAtTime(110, now + 0.3);
    subOsc.frequency.exponentialRampToValueAtTime(35, now + 1.2);
    
    subGain.gain.setValueAtTime(0.001, now);
    subGain.gain.exponentialRampToValueAtTime(0.22, now + 0.1);
    subGain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
    
    subOsc.connect(subGain);
    subGain.connect(audioCtx.destination);
    subOsc.start(now);
    subOsc.stop(now + 1.25);

    // Ethereal crystal chime
    const chimeOsc = audioCtx.createOscillator();
    const chimeGain = audioCtx.createGain();
    chimeOsc.type = 'triangle';
    chimeOsc.frequency.setValueAtTime(520, now);
    chimeOsc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
    chimeOsc.frequency.exponentialRampToValueAtTime(440, now + 1.5);

    chimeGain.gain.setValueAtTime(0.001, now);
    chimeGain.gain.exponentialRampToValueAtTime(0.10, now + 0.08);
    chimeGain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);

    chimeOsc.connect(chimeGain);
    chimeGain.connect(audioCtx.destination);
    chimeOsc.start(now);
    chimeOsc.stop(now + 1.55);
  } catch (e) {
    // Ignore audio autoplay restrictions
  }
}

// -------------------------------------------------------------
// Burst Button & Overdrive Interaction
// (Styled after Demon's Souls f385403bdcdefd073a1aadb78dd4977a.jpg)
// -------------------------------------------------------------
const burstBtn = document.getElementById('burst-btn');
const btnMainText = document.getElementById('btn-text-main');
const btnSubText = document.getElementById('btn-text-sub');
const flashEl = document.getElementById('flash');

let burstActiveTimeout = null;

function triggerBurst() {
  jellyfishList.forEach(j => j.burst());
  peatWorm.burst();
  playBurstSound();

  // UI button animations & text flare
  burstBtn.classList.remove('is-firing');
  void burstBtn.offsetWidth;
  burstBtn.classList.add('is-firing');
  burstBtn.classList.add('is-active');

  btnMainText.textContent = 'OVERDRIVE ACTIVE';
  btnSubText.textContent = '✦ 暴 衝 激 泳 中 ✦';

  flashEl.classList.remove('fire');
  void flashEl.offsetWidth;
  flashEl.classList.add('fire');

  if (burstActiveTimeout) clearTimeout(burstActiveTimeout);
  burstActiveTimeout = setTimeout(() => {
    burstBtn.classList.remove('is-active');
    btnMainText.textContent = 'BURST OVERDRIVE';
    btnSubText.textContent = '✦ 暴 衝 噴 流 ✦';
  }, 4800);
}

burstBtn.addEventListener('click', triggerBurst);
addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    triggerBurst();
  }
});

// Auto-trigger if ?burst=1 in URL (for testing)
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.has('burst')) {
  setTimeout(() => triggerBurst(), 500);
}

// -------------------------------------------------------------
// Main Render Loop
// -------------------------------------------------------------
function renderLoop() {
  requestAnimationFrame(renderLoop);

  const dt = Math.min(clock.getDelta(), 0.033);
  const t = clock.elapsedTime;

  jellyfishList.forEach(j => j.update(dt));
  jellyfishList.forEach(j => j.animate(t, dt));

  peatWorm.update(dt);
  peatWorm.animate(t, dt);

  let anyBurst = false;
  jellyfishList.forEach(j => { if (j.isBursting()) anyBurst = true; });
  if (peatWorm.isBursting()) anyBurst = true;

  // Dynamically accelerate snow motes and expand bloom in burst mode
  const targetMoteSpeed = anyBurst ? 2.6 : 1.0;
  snowMat.uniforms.uSpeedMultiplier.value += (targetMoteSpeed - snowMat.uniforms.uSpeedMultiplier.value) * (1 - Math.exp(-3.0 * dt));
  snowMat.uniforms.uTime.value = t;

  const targetBloom = anyBurst ? 0.90 : 0.64;
  bloomPass.strength += (targetBloom - bloomPass.strength) * (1 - Math.exp(-4.0 * dt));

  controls.update();
  composer.render();
}

// Fade out loading screen smoothly
setTimeout(() => document.getElementById('loading').classList.add('hide'), 300);
renderLoop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloomPass.setSize(innerWidth, innerHeight);
});
